name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  xcaddy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Caddy with this module
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          xcaddy build --with github.com/polarlightsllc/caddy-lb-spread=.
      - name: Module is registered and the Caddyfile adapts
        run: |
          ./caddy list-modules | grep -x 'http.reverse_proxy.selection_policies.spread'
          cat > Caddyfile <<'CADDY'
          :8080 {
          	request_header X-Shard-Key {host}
          	reverse_proxy 127.0.0.1:9001 127.0.0.1:9002 {
          		lb_policy spread X-Shard-Key {
          			max_replicas 4
          			inflight_per_replica 16
          			cooldown 10m
          			key_min_replicas hot.example.com 2
          		}
          	}
          }
          CADDY
          ./caddy adapt --config Caddyfile | grep -q '"policy":"spread"'
          ./caddy validate --config Caddyfile
